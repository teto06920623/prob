<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="stacked_avatars">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="manifest" href="manifest.json">

  <!-- استدعاء ملف التنسيقات -->
  <link rel="stylesheet" href="css/splash.css">

  <title>stacked_avatars</title>
</head>

<body>

  <!-- شاشة البداية -->
  <div id="splash-screen">

    <!-- حاوية الأفاتارات الخمسة -->
    <div class="avatars-container">
      <!-- الترتيب هنا مهم جداً: 
           الأول هو أقصى اليسار، والثالث هو المنتصف (الأكبر) -->
      <div class="avatar"><img src="assets/images/image.png" alt="Avatar 2"></div>
      <div class="avatar"><img src="assets/images/image copy 2.png" alt="Avatar 3"></div>
      <div class="avatar"><img src="assets/images/man_1.png" alt="Avatar 1"></div>
      <div class="avatar"><img src="assets/images/image copy 3.png" alt="Avatar 4"></div>
      <div class="avatar"><img src="assets/images/image copy 4.png" alt="Avatar 5"></div>
    </div>

    <!-- حاوية سيتم حقن الـ SVG (الكتابة) بداخلها عبر الجافاسكريبت -->
    <div id="splash-svg-container"></div>

  </div>

  <!-- استدعاء ملف الجافاسكريبت الخاص بالأنيميشن -->
  <script src="js/splash.js"></script>

  <!-- سكربت فلاتر الأساسي (يجب أن يكون آخر شيء) -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
